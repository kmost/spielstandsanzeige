name: CI

# Baut und testet die Spielstandsanzeige bei jedem Push und Pull Request.
# Model-Tests laufen headless; die UI-Tests (@Tag("ui")) brauchen ein Display und
# laufen deshalb unter xvfb. Ohne Display werden sie übersprungen, nicht rot.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = Tests inkl. UI-Tests unter xvfb + JaCoCo-Mindestabdeckung (siehe pom.xml)
      - name: Bauen, Tests ausführen und Abdeckung prüfen
        run: xvfb-run -a mvn -B verify

      - name: Coverage-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
