name: Windows-Release bauen

# Baut bei jedem Versions-Tag (v1.2.3) eine Windows-EXE mit eingebetteter
# Java-Runtime (jpackage), erstellt das GitHub-Release und hängt die Dateien an:
#   - Spielstandsanzeige-<version>.exe  → Installer (ohne Adminrechte, Startmenü-Eintrag)
#   - ...-windows-portable.zip          → entpacken und Spielstandsanzeige.exe starten
#   - SHA256SUMS.txt                    → SHA-256-Prüfsummen von Installer und ZIP
#   - Spielstandsanzeige-Anleitung.pdf  → Bedienungsanleitung (aus docs/anleitung.md)
# Release veröffentlichen: <version> im pom.xml auf 1.2.3 setzen, committen, dann
#   git tag v1.2.3 && git push origin v1.2.3
# Passen Tag und pom.xml-Version nicht zusammen, bricht der Workflow sofort ab.
# Die Release-Notizen werden automatisch erzeugt (Gliederung: .github/release.yml).
# Kann über workflow_dispatch auch manuell laufen (Ergebnis dann als Workflow-Artifact).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag-Version mit pom.xml abgleichen
        run: |
          pom_version=$(python3 -c "import xml.etree.ElementTree as E; ns={'m':'http://maven.apache.org/POM/4.0.0'}; print(E.parse('pom.xml').getroot().find('m:version',ns).text)")
          case "$GITHUB_REF" in
            refs/tags/*)
              tag_version="${GITHUB_REF_NAME#v}"
              if [ "$tag_version" != "$pom_version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME (Version $tag_version) passt nicht zur Version $pom_version im pom.xml. Version im pom.xml anpassen, committen und den Tag neu setzen."
                exit 1
              fi
              ;;
            *)
              echo "::notice::Kein Tag-Lauf (manuell gestartet): Versionsabgleich übersprungen, pom.xml-Version ist $pom_version."
              ;;
          esac

  anleitung-pdf:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pandoc und WeasyPrint installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc weasyprint

      - name: Anleitung als PDF setzen
        run: sh docs/anleitung-pdf-build.sh Spielstandsanzeige-Anleitung.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: anleitung-pdf
          path: Spielstandsanzeige-Anleitung.pdf
          if-no-files-found: error

  windows-exe:
    needs: [version-check, anleitung-pdf]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: WiX Toolset sicherstellen (für jpackage --type exe)
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Version aus Tag ableiten
        run: |
          # jpackage verlangt Versionen der Form x.y.z mit Hauptversion >= 1,
          # daher Tags wie v1.2.3 verwenden; sonst greift der Fallback.
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^[1-9]\d*\.\d+\.\d+$') { $version = '1.0.0' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bauen und Tests ausführen
        run: mvn -B package

      - name: App-Jar und Abhängigkeiten einsammeln
        run: |
          mvn -B dependency:copy-dependencies "-DoutputDirectory=target/dist" "-DincludeScope=runtime"
          Copy-Item target/spielstandsanzeige-*.jar target/dist/
          # Lizenztexte mit ausliefern: eigene MIT-Lizenz und die GPLv2+CE-Hinweise
          # für die gebündelten OpenJFX-Jars und die Temurin-Runtime. Alles in
          # target/dist landet über --input im app/-Ordner beider jpackage-Pakete.
          Copy-Item LICENSE target/dist/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.txt target/dist/

      - name: Installer-EXE bauen (jpackage)
        run: |
          $mainJar = (Get-ChildItem target/dist -Filter 'spielstandsanzeige-*.jar' | Select-Object -First 1).Name
          jpackage --type exe `
            --name Spielstandsanzeige `
            --app-version $env:APP_VERSION `
            --vendor 'Knut Most' `
            --input target/dist `
            --main-jar $mainJar `
            --main-class de.kmost.scoreboard.Main `
            --java-options '--enable-native-access=ALL-UNNAMED' `
            --icon packaging/Spielstandsanzeige.ico `
            --win-per-user-install --win-menu --win-shortcut --win-shortcut-prompt `
            --dest target/installer
          Get-ChildItem target/installer

      - name: Portable Version bauen (ZIP mit EXE)
        run: |
          $mainJar = (Get-ChildItem target/dist -Filter 'spielstandsanzeige-*.jar' | Select-Object -First 1).Name
          jpackage --type app-image `
            --name Spielstandsanzeige `
            --app-version $env:APP_VERSION `
            --vendor 'Knut Most' `
            --input target/dist `
            --main-jar $mainJar `
            --main-class de.kmost.scoreboard.Main `
            --java-options '--enable-native-access=ALL-UNNAMED' `
            --icon packaging/Spielstandsanzeige.ico `
            --dest target/app
          Compress-Archive -Path target/app/Spielstandsanzeige -DestinationPath "target/Spielstandsanzeige-$env:APP_VERSION-windows-portable.zip"

      # Platzhalter für die Code-Signierung (SignPath Foundation, noch nicht beantragt):
      # Der Signaturschritt gehört HIERHER, vor die Prüfsummen — signiert werden Installer-EXE
      # und Spielstandsanzeige.exe in target/app, danach erst die ZIP-Datei bauen und hashen.

      - name: SHA-256-Prüfsummen erzeugen
        run: |
          $files = @(Get-ChildItem target/installer/*.exe) + @(Get-Item "target/Spielstandsanzeige-$env:APP_VERSION-windows-portable.zip")
          # Format wie `sha256sum`: "<hash> *<datei>", Zeilenende LF
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()) *$($_.Name)" }
          [System.IO.File]::WriteAllText("$PWD/target/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content target/SHA256SUMS.txt

      - name: Anleitung-PDF übernehmen
        uses: actions/download-artifact@v4
        with:
          name: anleitung-pdf
          path: target/anleitung

      - name: Release erstellen und Artefakte anhängen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Spielstandsanzeige $tag" --generate-notes
          }
          gh release upload $tag `
            (Get-ChildItem target/installer/*.exe).FullName `
            "target/Spielstandsanzeige-$env:APP_VERSION-windows-portable.zip" `
            target/SHA256SUMS.txt `
            "target/anleitung/Spielstandsanzeige-Anleitung.pdf" `
            --clobber

      - name: Artefakte als Workflow-Artifact sichern
        uses: actions/upload-artifact@v4
        with:
          name: spielstandsanzeige-windows
          path: |
            target/installer/*.exe
            target/*.zip
            target/SHA256SUMS.txt
            target/anleitung/*.pdf
